services:
  service:
    build:
      context: .
      dockerfile: Dockerfile.service
    command:
      - uvicorn
      - service.e2e_app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      RAG_TRACING: "0"
      # Auth (x5bz.2). A throwaway signing key for the ephemeral E2E stack —
      # the service refuses to sign cookies without one. SESSION_COOKIE_SECURE=0
      # because the E2E stack is served over plain http; a Secure cookie would
      # never be sent back and every guarded request would 401. Production keeps
      # the default (1) and gets the real key from Secret Manager.
      SESSION_SECRET: "e2e-only-throwaway-session-signing-key"
      SESSION_COOKIE_SECURE: "0"
      # The whole Playwright run shares ONE auth rate-limit bucket, and the
      # production default is sized for one household.
      #
      # `AUTH_TRUSTED_PROXY_HOPS` defaults to 0 and nginx.conf sets only
      # X-Real-IP, so `client_source()` keys on the PEER address — which behind
      # the `ui` container is the nginx container, identically for every request
      # from every worker and every retry. `check_auth_attempt()` spends budget
      # on success as well as failure, so a clean 9-test run spends ~11-13 of
      # the default 30 per 300s. A run with a few genuine failures (Playwright
      # starts a fresh worker per failure, each provisioning two accounts) plus
      # `retries: 1` crosses 30 and turns every later sign-in into a 429 —
      # a red run that says nothing about the product.
      #
      # Raised rather than disabled: the limiter still RUNS, on the real code
      # path, so a change that breaks it is still exercised here. The number is
      # simply above anything one E2E run can spend. Production is untouched —
      # nothing outside this file sets these.
      #
      # Only the SOURCE dimension is raised. The per-account budget keys on the
      # email, and every account this suite touches is created by it with a
      # per-run-unique address, so no account sees more than a handful of
      # attempts — `AUTH_RATE_LIMIT_PER_ACCOUNT` keeps its production value and
      # keeps guarding the brute-force path.
      AUTH_RATE_LIMIT_PER_SOURCE: "100000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,sys,urllib.request;
          body=json.load(urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3));
          sys.exit(0 if body.get('status') == 'ok' else 1)
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  ui:
    build:
      context: ./ui
    ports:
      - "4173:80"
    depends_on:
      service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1/
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 3s
