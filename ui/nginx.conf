server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # va8 — the second layer, in front of the SPA document and every proxied
    # route. Keep this value byte-identical to CONTENT_SECURITY_POLICY in
    # service/security_headers.py, which explains it directive by directive;
    # tests/test_security_headers_contract.py fails if the two ever drift.
    #
    # Quoted because the value contains ';', which nginx would otherwise read as
    # the end of the directive. `always` so 4xx/5xx carry it too.
    #
    # Declared at server level and deliberately NOT inside any location: nginx
    # does not merge add_header into a location that defines one of its own, so
    # a location that ever gains an add_header silently loses this policy. The
    # contract test guards that.
    #
    # The six proxied locations carry this header TWICE — once from here, once
    # from the service's own middleware. The values are identical and a browser
    # enforces every policy it is given, which is cheaper than a
    # proxy_hide_header a reader would have to reason about.
    add_header Content-Security-Policy "img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # proxy API calls to the service container
    location /chat {
        proxy_pass         http://service:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /healthz {
        proxy_pass         http://service:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Model catalog (b8o.1). MUST be proxied — same trap as /auth: without
    # this the SPA fallback below answers GET /models with index.html.
    location /models {
        proxy_pass         http://service:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Auth endpoints (x5bz.2): signup / login / logout / me. MUST be proxied —
    # without this the SPA fallback below swallows POST /auth/signup and nginx
    # answers 405 (a static file can't take a POST). Same trap as cnqf.
    location /auth {
        proxy_pass         http://service:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /metrics {
        proxy_pass         http://service:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # History + attachments (keep in sync with the Vite dev proxy list).
    # client_max_body_size: attachment uploads are base64 JSON — a 2 MB file
    # (the service's decoded cap) is ~2.7 MB on the wire; nginx's 1 MB default
    # would 413 it before the service could apply its own limit.
    location /conversations {
        proxy_pass           http://service:8000;
        proxy_http_version   1.1;
        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
        proxy_read_timeout   120s;
        client_max_body_size 4m;
    }

    # SPA fallback — all other paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
