server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # va8 — the second layer, in front of the SPA document and every proxied
    # route. Keep this value byte-identical to CONTENT_SECURITY_POLICY in
    # service/security_headers.py, which explains it directive by directive;
    # tests/test_security_headers_contract.py fails if the two ever drift.
    #
    # Quoted because the value contains ';', which nginx would otherwise read as
    # the end of the directive. `always` so 4xx/5xx carry it too.
    #
    # Declared at server level and deliberately NOT inside any location: nginx
    # does not merge add_header into a location that defines one of its own, so
    # a location that ever gains an add_header silently loses this policy. The
    # contract test guards that.
    #
    # The nine proxied locations carry this header TWICE — once from here, once
    # from the service's own middleware. The values are identical and a browser
    # enforces every policy it is given, which is cheaper than a
    # proxy_hide_header a reader would have to reason about.
    add_header Content-Security-Policy "img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # y58 — SEC-17's named header plus the non-table-page decision recorded in
    # docs/adr/security-headers-non-table-pages.md (and, alongside the CSP's
    # own rationale, in service/security_headers.py). Byte-identical to
    # X_CONTENT_TYPE_OPTIONS / REFERRER_POLICY / CROSS_ORIGIN_OPENER_POLICY /
    # PERMISSIONS_POLICY there; tests/test_security_headers_contract.py fails
    # if any of the four ever drifts. Same server-level placement as the CSP
    # above, for the same reason: a location that adds its own add_header
    # would silently lose all of these too.
    #
    # The nine proxied locations send these twice as well (here + the service).
    # Harmless while they answer JSON, but unlike the CSP a duplicate is NOT
    # enforced twice: a doubled COOP is unparseable and ignored. A proxied route
    # that ever serves a document must send only one copy.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # proxy API calls to the service container
    location /chat {
        proxy_pass         http://service:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /healthz {
        proxy_pass         http://service:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Model catalog (b8o.1). MUST be proxied — same trap as /auth: without
    # this the SPA fallback below answers GET /models with index.html.
    location /models {
        proxy_pass         http://service:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Auth endpoints (x5bz.2): signup / login / logout / me. MUST be proxied —
    # without this the SPA fallback below swallows POST /auth/signup and nginx
    # answers 405 (a static file can't take a POST). Same trap as cnqf.
    location /auth {
        proxy_pass         http://service:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /metrics {
        proxy_pass         http://service:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # History + attachments (keep in sync with the Vite dev proxy list).
    # client_max_body_size: attachment uploads are base64 JSON — a 2 MB file
    # (the service's decoded cap) is ~2.7 MB on the wire; nginx's 1 MB default
    # would 413 it before the service could apply its own limit.
    location /conversations {
        proxy_pass           http://service:8000;
        proxy_http_version   1.1;
        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
        proxy_read_timeout   120s;
        client_max_body_size 4m;
    }

    # The GM's campaigns and seats, and an account's own offers and seats
    # (1kg.2.2). Host is forwarded because the Workbench origin check compares
    # Origin with Host (SEC-7); X-Real-IP because Remove asks for the password
    # again and the auth throttle keys on the source address. No add_header
    # here: nginx would drop the server-level policies above for this location.
    location /campaigns {
        # A document create or field patch carries a whole document: the
        # largest valid one is about 5.2 MB of UTF-8, and nginx's default is
        # 1 MB. The service's own cap is DOCUMENT_BODY_MAX_BYTES (6 MiB,
        # service/documents_api.py); every other body there stays at 8 KiB.
        client_max_body_size 6m;
        proxy_pass         http://service:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # A media upload's bytes (1kg.8.1.2, RT-10), and nothing else under
    # /campaigns: a regex location, so it wins over the prefix location above
    # for this one path while every other /campaigns request keeps that one's
    # settings. The body streams to the service unbuffered, so the service's
    # count is the real one (SEC-26); the cap is the largest SEC-26 cap
    # (AUDIO_MAX_BYTES, 20,000,000 bytes, under 20 MiB) and the service applies
    # each kind's exact cap to the count; the request stays open through
    # processing (MS-6), hence the timeout. No add_header here either: nginx
    # would drop the server-level policies above for this location.
    location ~ ^/campaigns/[^/]+/assets/[^/]+/bytes$ {
        client_max_body_size    20m;
        proxy_request_buffering off;
        proxy_read_timeout      180s;
        proxy_pass              http://service:8000;
        proxy_http_version      1.1;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
    }

    # A client path for the player's seat screens must not begin with /seats:
    # nginx proxies by string prefix, so the SPA would never see it.
    location /seats {
        proxy_pass         http://service:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # SPA fallback — all other paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
