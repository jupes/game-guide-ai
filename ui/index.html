<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/app-icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aetheril — D&amp;D 5e AI Companion</title>
    <!-- Synchronously restore the saved theme before paint to avoid a
         dark-to-light flash on reload (research doc risk #7). The React
         ThemeProvider still owns the authoritative state; this just gets
         data-theme onto <html> as early as possible. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('aetheril-theme');
          if (saved === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="session-restore-status" class="auth-screen" hidden>
      <p role="status">Loading…</p>
      <div class="auth-screen__card" hidden>
        <div role="alert">
          <h1>Can’t reach the service</h1>
          <p>We couldn’t check your session. Your workspace is hidden until we can verify your account.</p>
        </div>
        <button type="button" class="auth-screen__retry">Try again</button>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
