# Pull-request and merge pipeline: tests → E2E + metrics gates → deploy.
# Full operator guide (activation switches, force-deploy, back-out): docs/ci.md
#
# Activation state (jobs light up as infrastructure lands, nothing is faked):
#   tests            — always run.
#   ui-e2e           — always runs against the production Compose stack.
#   retrieval-metrics — needs secrets EVAL_DATABASE_URL + OPENAI_API_KEY
#                       (a reachable corpus DB; the corpus is deliberately not
#                       in git — licensing). Skips loudly until configured.
#   deploy           — needs repo variable DEPLOY_TARGET + scripts/deploy.sh
#                       (hosting epic 17u). No-ops loudly until configured.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Deploy even if the retrieval-metrics gate failed"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false # never cancel a run that may be mid-deploy

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A real PostgreSQL, for the tests whose whole subject is behaviour no fake
    # reproduces: the atomic single-use invite guarantee (row locks) and what the
    # canonical schema actually enforces (cascades, SET NULL, NOT VALID).
    #
    # It is an EMPTY database: no corpus, no book text. The corpus is deliberately
    # not in git (licensing), and none of these tests need it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: ci_throwaway_not_a_secret
          POSTGRES_DB: game_guide_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d game_guide_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # --frozen: install exactly what uv.lock pins and FAIL if the lock has
      # drifted from pyproject.toml. Without it CI re-resolves every transitive
      # dependency on each run, so a green build says nothing about what ships.
      - name: Install from the lockfile
        run: uv sync --frozen --extra dev
      - name: Lint (ruff)
        run: uv run --frozen --no-sync ruff check .
      - name: Typecheck (mypy — service/ + config.py)
        run: uv run --frozen --no-sync mypy
      - name: pytest (service + ingestion + repo guards) + coverage gate
        run: uv run --frozen --no-sync python -m pytest -q --cov
      # Separate step, and a separate pytest run, so DATABASE_URL is scoped to
      # the tests that want a database. Exporting it for the whole suite would
      # change what the startup path does in every unrelated test (the lifespan
      # builds a real PostgresAuthStore when it can connect).
      #
      # No skip branch here: DATABASE_URL is set, so an unreachable database
      # FAILS the job rather than reporting a green skip.
      - name: Integration tests against real PostgreSQL
        env:
          DATABASE_URL: postgresql://rag:ci_throwaway_not_a_secret@localhost:5432/game_guide_ai
        run: |
          uv run --frozen --no-sync python -m pytest -q --no-cov \
            service/tests/test_invite_atomic.py tests/test_schema.py

  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium (storybook browser test project)
        run: bunx playwright install --with-deps chromium
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Vitest (jsdom + storybook browser projects)
        run: bun run test
      # Separate run: the storybook project renders every story in a real
      # browser, which inflates coverage without adding behavioural assertions,
      # so the gate measures the jsdom project only. Thresholds live in
      # vite.config.ts and are a ratchet — raise them, never lower them.
      - name: Coverage gate (jsdom project)
        run: bun run test:coverage

  # Browser-level release tracer. This builds and starts the production Nginx
  # UI plus a deterministic FastAPI service, then records TTFB/FCP/LCP/CLS.
  ui-e2e:
    needs: [python-tests, ui-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Playwright E2E and UI performance budgets
        run: bun run test:e2e
      - name: Upload Playwright performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-results-${{ github.sha }}
          path: ui/e2e-results
          if-no-files-found: warn
          retention-days: 30

  # Retrieval quality against the live corpus DB. The corpus is not in git
  # (licensing — no verbatim book text in the repo), so this job can only run
  # once EVAL_DATABASE_URL points at a reachable, ingested pgvector instance.
  retrieval-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check eval prerequisites
        id: prereq
        run: |
          if [ -n "${{ secrets.EVAL_DATABASE_URL }}" ] && [ -n "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Retrieval eval (eval_golden)"
              echo ""
              echo "Skipped — configure the \`EVAL_DATABASE_URL\` and \`OPENAI_API_KEY\`"
              echo "repository secrets to run retrieval metrics per merge (docs/ci.md)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: astral-sh/setup-uv@v5
        if: steps.prereq.outputs.ready == 'true'
        with:
          enable-cache: true
      - name: Snapshot committed baseline
        if: steps.prereq.outputs.ready == 'true'
        run: cp ingestion/eval_results.json /tmp/eval_baseline.json
      - name: Run retrieval eval (eval_golden)
        if: steps.prereq.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.EVAL_DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUTF8: "1"
        run: uv run --with "psycopg[binary]" --with openai python ingestion/eval_golden.py
      - name: Regression gate vs baseline
        if: steps.prereq.outputs.ready == 'true'
        run: |
          uv run python scripts/ci/eval_gate.py \
            --baseline /tmp/eval_baseline.json \
            --fresh ingestion/eval_results.json \
            --threshold-points 2.0
      - name: Upload fresh results artifact
        if: steps.prereq.outputs.ready == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.sha }}
          path: ingestion/eval_results.json

  # Auto-deploy when everything above is green. A metrics REGRESSION blocks
  # this job; override by re-running the workflow with force_deploy=true
  # ("proceed anyway"), or revert the merge commit ("back out") — docs/ci.md.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [python-tests, ui-tests, ui-e2e, retrieval-metrics]
    if: >-
      always()
      && github.event_name != 'pull_request'
      && needs.python-tests.result == 'success'
      && needs.ui-tests.result == 'success'
      && needs.ui-e2e.result == 'success'
      && (needs.retrieval-metrics.result == 'success'
          || needs.retrieval-metrics.result == 'skipped'
          || (github.event_name == 'workflow_dispatch' && inputs.force_deploy))
    environment: production
    permissions:
      id-token: write   # WIF: mint the OIDC token google-github-actions/auth exchanges
      contents: read    # actions/checkout
    env:
      WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}   # gates the auth steps until WIF is set up
    steps:
      - uses: actions/checkout@v4
      # Auth steps stay dormant until the WIF secrets exist (docs/deploy-gcp.md §8),
      # so an unconfigured repo still reaches the graceful no-op below instead of failing.
      - name: Authenticate to Google Cloud (WIF)
        if: env.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - name: Set up gcloud
        if: env.WIF_PROVIDER != ''
        uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        if: env.WIF_PROVIDER != ''
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - name: Deploy (or report unconfigured)
        env:
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
        run: |
          if [ -z "$DEPLOY_TARGET" ]; then
            {
              echo "## Deploy"
              echo ""
              echo "No-op — no hosting configured yet (epic 17u). To activate:"
              echo "set the \`DEPLOY_TARGET\` repository variable and add an"
              echo "executable \`scripts/deploy.sh\` (docs/ci.md)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ ! -x scripts/deploy.sh ]; then
            echo "DEPLOY_TARGET is set but scripts/deploy.sh is missing or not executable." >&2
            exit 1
          fi
          ./scripts/deploy.sh "$DEPLOY_TARGET" "$GITHUB_SHA"
          {
            echo "## Deploy"
            echo ""
            echo "Deployed \`$GITHUB_SHA\` to \`$DEPLOY_TARGET\`."
          } >> "$GITHUB_STEP_SUMMARY"
