# Pull-request and merge pipeline: tests → E2E + metrics gates → deploy.
# Full operator guide (activation switches, force-deploy, back-out): docs/ci.md
#
# Activation state (jobs light up as infrastructure lands, nothing is faked):
#   tests            — always run.
#   contract-parity  — always runs, and gates deploy: the timeline route serves
#                       the Workbench contract (agent-forge-harness-oe6).
#   ui-e2e           — always runs against the production Compose stack.
#   retrieval-metrics — needs secrets EVAL_DATABASE_URL + OPENAI_API_KEY
#                       (a reachable corpus DB; the corpus is deliberately not
#                       in git — licensing). Skips loudly until configured.
#   deploy           — needs repo variable DEPLOY_TARGET + scripts/deploy.sh
#                       (hosting epic 17u). SKIPS until configured — never a green
#                       check for having deployed nothing — and once it does run,
#                       verifies the built image is actually serving.
#
# Runner image: every job pins ubuntu-24.04, not ubuntu-latest (which becomes
# Ubuntu 26 on 2026-10-19). Move it on purpose, once every job, deploy's gcloud
# steps included, has run green on the new image. Actions sit on their Node 24
# majors. service/tests/test_ci_workflow.py holds both (agent-forge-harness-7q6).

name: CI

on:
  push:
    branches: [master]
  pull_request:
    # INTEGRATION BRANCH ONLY - this line never reaches master. The stacked
    # Workbench branches are merged into integration/1kg-workbench so that work
    # built on them gets this pipeline, PostgreSQL job included, from a pull
    # request into that branch. A pull request never deploys (see `deploy`).
    branches: [master, "integration/**"]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Deploy even if the retrieval-metrics gate failed"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false # never cancel a run that may be mid-deploy

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    # The job normally takes 10-12 min. A slow apt mirror or runner used to
    # cancel it with no test failing (agent-forge-harness-ky89). The PostgreSQL
    # integration suite used to run here too; it is now the parallel
    # `python-db-tests` job below (agent-forge-harness-k768).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # --frozen: install exactly what uv.lock pins and FAIL if the lock has
      # drifted from pyproject.toml. Without it CI re-resolves every transitive
      # dependency on each run, so a green build says nothing about what ships.
      - name: Install from the lockfile
        run: uv sync --frozen --extra dev
      # ffmpeg and ffprobe for the media upload's audio half (1kg.8.1.2, MS-6):
      # a system package, not a Python one. Without them the audio tests FAIL
      # in CI rather than skip (service/tests/test_assets_api.py). The images
      # are 1kg.9.5's to change (media ADR section 8.3), not this workflow's.
      #
      # The .deb itself is cached: some runners draw a slow Ubuntu archive
      # mirror and the plain `apt-get install` has taken as long as 16 min
      # (agent-forge-harness-k768) against a normal 17-42s. Master's push run
      # seeds the cache every PR restores; apt still verifies each cached
      # .deb's hash against the signed package lists it re-fetches on every
      # run, so a poisoned cache entry cannot install an unverified package.
      - name: Cache the ffmpeg .deb
        uses: actions/cache@v5
        with:
          path: ~/.cache/apt-archives
          key: apt-ffmpeg-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-v1
          restore-keys: |
            apt-ffmpeg-${{ runner.os }}-${{ env.ImageOS }}-
            apt-ffmpeg-${{ runner.os }}-
      # ImageOS/ImageVersion are set by the GitHub-hosted runner itself (not
      # something this repo configures) and feed the cache key above; echoed
      # here so a key that stops matching is easy to diagnose from the log.
      - name: Runner image (cache key inputs)
        run: echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
      - name: Install ffmpeg (media processing)
        run: |
          mkdir -p "$HOME/.cache/apt-archives/partial"
          sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/.cache/apt-archives" -o APT::Keep-Downloaded-Packages=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30 ffmpeg
          # `apt-get` ran under sudo, so root now owns the cache dir; give it
          # back to the runner user or `actions/cache`'s post-job save step
          # cannot read it. The lock file and partial/ are apt's own
          # in-progress bookkeeping, not package data worth caching, and a
          # stale lock left behind would block the next run's apt-get.
          sudo chown -R "$(id -u)":"$(id -g)" "$HOME/.cache/apt-archives"
          sudo rm -f "$HOME/.cache/apt-archives/lock"
          sudo find "$HOME/.cache/apt-archives/partial" -mindepth 1 -delete
      - name: Lint (ruff)
        run: uv run --frozen --no-sync ruff check .
      - name: Typecheck (mypy — service/ + config.py)
        run: uv run --frozen --no-sync mypy
      - name: pytest (service + ingestion + repo guards) + coverage gate
        run: uv run --frozen --no-sync python -m pytest -q --cov

  # The PostgreSQL integration suite, split out of `python-tests` so it runs in
  # parallel with the unit/coverage step instead of after it
  # (agent-forge-harness-k768): the two used to run one after the other in the
  # same job, 5-9 min of unit tests then 4-6.5 min of integration tests. This
  # job needs no ffmpeg, so it carries none of the apt caching above.
  python-db-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A real PostgreSQL, for the tests whose whole subject is behaviour no fake
    # reproduces: the atomic single-use invite guarantee (row locks), what the
    # schema actually enforces (cascades, SET NULL, NOT VALID), the migration
    # runner (adoption, drift, concurrent startups), and the bounded pools, the
    # transaction boundary and the job outbox (1kg.1.5).
    #
    # It is an EMPTY database: no corpus, no book text. The corpus is deliberately
    # not in git (licensing), and none of these tests need it. The corpus-schema
    # tests build the empty `dnd` schema in throwaway databases from
    # vector-db/init/, which starts with CREATE EXTENSION vector, so the image
    # is the one docker-compose.yml runs, pgvector included (agent-forge-harness-5fo).
    services:
      postgres:
        image: pgvector/pgvector:pg17-bookworm
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: ci_throwaway_not_a_secret
          POSTGRES_DB: game_guide_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d game_guide_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # --frozen: install exactly what uv.lock pins and FAIL if the lock has
      # drifted from pyproject.toml. Without it CI re-resolves every transitive
      # dependency on each run, so a green build says nothing about what ships.
      - name: Install from the lockfile
        run: uv sync --frozen --extra dev
      # Separate step, and a separate pytest run, so DATABASE_URL is scoped to
      # the tests that want a database. Exporting it for the whole suite would
      # change what the startup path does in every unrelated test (the lifespan
      # builds a real PostgresAuthStore when it can connect).
      #
      # No skip branch here: DATABASE_URL is set, so an unreachable database
      # FAILS the job rather than reporting a green skip. Every test module that
      # gates on DATABASE_URL must be named below; test_ci_workflow.py finds them
      # and fails when one is missing.
      - name: Integration tests against real PostgreSQL
        env:
          DATABASE_URL: postgresql://rag:ci_throwaway_not_a_secret@localhost:5432/game_guide_ai
        run: |
          uv run --frozen --no-sync python -m pytest -q --no-cov \
            service/tests/test_invite_atomic.py tests/test_schema.py \
            tests/test_migrations_db.py tests/test_db_postgres.py \
            tests/test_campaign_db.py tests/test_conversation_db.py \
            tests/test_campaign_summary_db.py \
            tests/test_timeline_db.py tests/test_tool_invocation_db.py \
            tests/test_document_db.py tests/test_documents_api_db.py tests/test_seats_db.py \
            tests/test_usage_ledger_db.py \
            tests/test_retired_model_binding_db.py \
            tests/test_corpus_schema.py ingestion/tests/test_scrape_wikidot.py \
            tests/test_asset_db.py tests/test_session_dividers_db.py \
            tests/test_reveal_db.py tests/test_eligibility_db.py tests/test_assets_api_db.py \
            tests/test_document_generation_db.py tests/test_groups_api_db.py \
            tests/test_document_tools_db.py \
            tests/test_document_edit_store_db.py tests/test_workbench_load_db.py \
            tests/test_timeline_edit_entries_db.py

  ui-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # The Live Session Assistant threat model's cross-references: every cited
      # id defined, threats and obligations naming each other, every rule a
      # control, every Medium residual a risk the owner answers. It reads that
      # one record; the full checkdocs.ts also wants the Beads tracker.
      - name: Threat model cross-references
        working-directory: docs/forge/tools/live-session-assistant
        run: bun threatmodel.ts
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium (storybook browser test project)
        run: bunx playwright install --with-deps chromium
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Vitest (jsdom + storybook browser projects)
        run: bun run test
      # Separate run: the storybook project renders every story in a real
      # browser, which inflates coverage without adding behavioural assertions,
      # so the gate measures the jsdom project only. Thresholds live in
      # vite.config.ts and are a ratchet — raise them, never lower them.
      - name: Coverage gate (jsdom project)
        run: bun run test:coverage

  # Browser-level release tracer. This builds and starts the production Nginx
  # UI plus a deterministic FastAPI service, then records TTFB/FCP/LCP/CLS.
  #
  # No `needs:` (agent-forge-harness-k768): this job downloads no artifact from
  # python-tests, python-db-tests or ui-tests — it builds and starts its own
  # stack from the checked-out source — so it can run in parallel with them
  # instead of waiting on both to finish first. `deploy` below still gates on
  # every test job's own result, ui-e2e included.
  ui-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Playwright E2E and UI performance budgets
        run: bun run test:e2e
      - name: Upload Playwright performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-e2e-results-${{ github.sha }}
          path: ui/e2e-results
          if-no-files-found: warn
          retention-days: 30

  # Retrieval quality against the live corpus DB. The corpus is not in git
  # (licensing — no verbatim book text in the repo), so this job can only run
  # once EVAL_DATABASE_URL points at a reachable, ingested pgvector instance.
  retrieval-metrics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Check eval prerequisites
        id: prereq
        run: |
          if [ -n "${{ secrets.EVAL_DATABASE_URL }}" ] && [ -n "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Retrieval eval (eval_golden)"
              echo ""
              echo "Skipped — configure the \`EVAL_DATABASE_URL\` and \`OPENAI_API_KEY\`"
              echo "repository secrets to run retrieval metrics per merge (docs/ci.md)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: astral-sh/setup-uv@v7
        if: steps.prereq.outputs.ready == 'true'
        with:
          enable-cache: true
      - name: Snapshot committed baseline
        if: steps.prereq.outputs.ready == 'true'
        run: cp ingestion/eval_results.json /tmp/eval_baseline.json
      - name: Run retrieval eval (eval_golden)
        if: steps.prereq.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.EVAL_DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUTF8: "1"
        run: uv run --with "psycopg[binary]" --with openai python ingestion/eval_golden.py
      - name: Regression gate vs baseline
        if: steps.prereq.outputs.ready == 'true'
        run: |
          uv run python scripts/ci/eval_gate.py \
            --baseline /tmp/eval_baseline.json \
            --fresh ingestion/eval_results.json \
            --threshold-points 2.0
      - name: Upload fresh results artifact
        if: steps.prereq.outputs.ready == 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results-${{ github.sha }}
          path: ingestion/eval_results.json

  # Do the Pydantic and Zod halves of the Workbench wire contract agree? The
  # shared fixtures cover the examples someone wrote; this mutates every valid
  # one and compares the two validators' verdicts (docs/workbench-wire-contract.md).
  # It is the only job that needs both toolchains, which is why it is its own job.
  contract-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
      - name: Install the service from the lockfile
        run: uv sync --frozen --extra dev
      - name: Install the UI from the lockfile
        working-directory: ui
        run: bun install --frozen-lockfile
      - name: Differential fuzz (Pydantic vs Zod)
        run: uv run --frozen --no-sync python contracts/workbench/tools/differential_fuzz.py

  # Auto-deploy when everything above is green. A metrics REGRESSION blocks
  # this job; override by re-running the workflow with force_deploy=true
  # ("proceed anyway"), or revert the merge commit ("back out") — docs/ci.md.
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [python-tests, python-db-tests, ui-tests, ui-e2e, contract-parity, retrieval-metrics]
    # DEPLOY_TARGET gates the JOB, not a step inside it. Previously an
    # unconfigured repo ran the job, printed a "No-op" summary and exited 0 — a
    # green check for deploying nothing, which is exactly how a merge came to be
    # read as live (x5bz.1.7). Skipped is not a pass in the job list. Note the
    # run's overall conclusion is still success: a skipped leaf job does not fail
    # its workflow, so this fixes the per-job signal, not the badge.
    #
    # It has to be `vars` here: the WIF credentials are `secrets`, and the
    # `secrets` context is NOT available in a job-level `if`. So the other half of
    # the configuration cannot gate the job — set the SECRETS FIRST, then the
    # variable, or the job runs without credentials and fails at `docker push`.
    #
    # `github.ref` pins the deploy to master. `workflow_dispatch` takes any ref, so
    # without it `gh workflow run ci.yml --ref <branch>` runs this job for that
    # branch's SHA, and the only thing in the way is the WIF trust condition
    # (docs/deploy-gcp.md §8) — a red deploy job failing at authentication. That
    # condition is still the security boundary: a branch can edit its own copy of
    # this file. This guards the accident — any other ref tests, and skips deploy.
    if: >-
      always()
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/master'
      && vars.DEPLOY_TARGET != ''
      && needs.python-tests.result == 'success'
      && needs.python-db-tests.result == 'success'
      && needs.ui-tests.result == 'success'
      && needs.ui-e2e.result == 'success'
      && needs.contract-parity.result == 'success'
      && (needs.retrieval-metrics.result == 'success'
          || needs.retrieval-metrics.result == 'skipped'
          || (github.event_name == 'workflow_dispatch' && inputs.force_deploy))
    environment: production
    permissions:
      id-token: write   # WIF: mint the OIDC token google-github-actions/auth exchanges
      contents: read    # actions/checkout
    env:
      WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}   # gates the auth steps until WIF is set up
    steps:
      - uses: actions/checkout@v7
      # Auth steps stay dormant until the WIF secrets exist (docs/deploy-gcp.md §8),
      # so an unconfigured repo still reaches the graceful no-op below instead of failing.
      - name: Authenticate to Google Cloud (WIF)
        if: env.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - name: Set up gcloud
        if: env.WIF_PROVIDER != ''
        uses: google-github-actions/setup-gcloud@v3
      - name: Configure Docker for Artifact Registry
        if: env.WIF_PROVIDER != ''
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - name: Deploy
        id: deploy
        env:
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
        run: |
          if [ ! -x scripts/deploy.sh ]; then
            echo "DEPLOY_TARGET is set but scripts/deploy.sh is missing or not executable." >&2
            exit 1
          fi
          ./scripts/deploy.sh "$DEPLOY_TARGET" "$GITHUB_SHA"

      # `gcloud run deploy` exiting 0 is not evidence: a revision can be created,
      # fail to become Ready, and leave the PREVIOUS one serving while the command
      # still succeeds. That is how a green deploy job came to mean "auth is live"
      # on 2026-08-09 while the pre-auth build was still serving (x5bz.1.7). Ask
      # the platform what is actually running, using the image deploy.sh reports.
      - name: Verify the deploy landed
        run: |
          python scripts/verify_deploy.py \
            "${{ steps.deploy.outputs.service }}" \
            "${{ steps.deploy.outputs.region }}" \
            "${{ steps.deploy.outputs.project }}" \
            "${{ steps.deploy.outputs.image }}" \
            "${{ steps.deploy.outputs.image_digest }}"
          {
            echo "## Deploy"
            echo ""
            echo "Deployed \`$GITHUB_SHA\` to \`${{ vars.DEPLOY_TARGET }}\` and"
            echo "verified \`${{ steps.deploy.outputs.image }}\` is serving 100% of traffic."
          } >> "$GITHUB_STEP_SUMMARY"
